name: Auto Stickman YouTube Shorts

on:
  workflow_dispatch:
  schedule:
    # Runs twice daily (06:00 UTC and 18:00 UTC)
    - cron: '0 6,18 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai edge-tts moviepy==1.0.3 Pillow requests

      - name: Generate and send Short to Make.com
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python bot.py
